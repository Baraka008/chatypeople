[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/api/conversations/:id/messages"
to = "/.netlify/functions/messages/:id"
status = 200

[[redirects]]
from = "/api/conversations"
to = "/.netlify/functions/conversations"
status = 200

[[redirects]]
from = "/api/profile"
to = "/.netlify/functions/profile"
status = 200

[[redirects]]
from = "/api/users"
to = "/.netlify/functions/users"
status = 200

[[redirects]]
from = "/api/notifications"
to = "/.netlify/functions/notifications"
status = 200
